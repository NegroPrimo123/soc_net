syntax = "proto3";

package graphranking;

option go_package = "social-network/proto/graphranking";

// GraphRankingService — микросервис вычисления топологии графа связей,
// персонализированного PageRank и мультифакторного ранжирования контента.
service GraphRankingService {
    // Получение топологии социального графа с заданной глубиной эго-сети
    rpc GetTopology (TopologyRequest) returns (TopologyResponse);

    // Вычисление кратчайшего пути и степеней разделения (алгоритм "Шесть рукопожатий" BFS)
    rpc GetShortestPath (PathRequest) returns (PathResponse);

    // Предиктивный расчет рекомендаций связей (индекс Адамик-Адар / Жаккар)
    rpc GetRecommendations (RecommendationRequest) returns (RecommendationResponse);

    // Персонализированное мультифакторное ранжирование публикаций для ленты
    rpc RankFeed (RankFeedRequest) returns (RankFeedResponse);

    // Детализация факторов ранжирования (Explain Ranking)
    rpc ExplainRanking (ExplainRequest) returns (ExplainResponse);
}

message TopologyRequest {
    int32 depth = 1;
    int64 current_user_id = 2;
}

message GraphNode {
    int64 id = 1;
    string username = 2;
    string display_name = 3;
    string avatar_url = 4;
    double pagerank = 5;
}

message GraphEdge {
    int64 source = 1;
    int64 target = 2;
    double weight = 3;
}

message TopologyResponse {
    repeated GraphNode nodes = 1;
    repeated GraphEdge edges = 2;
    int32 total_nodes = 3;
    int32 total_edges = 4;
}

message PathRequest {
    int64 from_user_id = 1;
    int64 to_user_id = 2;
}

message PathStep {
    int64 id = 1;
    string username = 2;
    string display_name = 3;
    string avatar_url = 4;
}

message PathResponse {
    int32 distance = 1;
    repeated PathStep path = 2;
}

message RecommendationRequest {
    int64 user_id = 1;
    int32 limit = 2;
}

message RecommendationItem {
    int64 user_id = 1;
    string username = 2;
    string display_name = 3;
    string avatar_url = 4;
    double score = 5;
    int32 mutual_friends_count = 6;
}

message RecommendationResponse {
    repeated RecommendationItem recommendations = 1;
}

message PostCandidate {
    int64 id = 1;
    int64 user_id = 2;
    string content = 3;
    int64 created_at_unix = 4;
    int32 likes_count = 5;
    int32 comments_count = 6;
    repeated string hashtags = 7;
}

message RankFeedRequest {
    int64 current_user_id = 1;
    int32 limit = 2;
    int32 offset = 3;
    repeated PostCandidate candidates = 4;
}

message RankedPost {
    int64 id = 1;
    int64 user_id = 2;
    double final_score = 3;
    double affinity_score = 4;
    double freshness_score = 5;
    double engagement_score = 6;
    double topic_score = 7;
    double diversity_penalty = 8;
}

message RankFeedResponse {
    repeated RankedPost ranked_posts = 1;
}

message ExplainRequest {
    int64 user_id = 1;
    int64 post_id = 2;
}

message ExplainResponse {
    int64 post_id = 1;
    double total_score = 2;
    double affinity_score = 3;
    double freshness_score = 4;
    double engagement_score = 5;
    double topic_score = 6;
    double diversity_penalty = 7;
}
