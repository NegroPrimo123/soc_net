<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgOleg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#bgOleg)"/>
  <!-- Head & Visor -->
  <rect x="26" y="24" width="48" height="42" rx="10" fill="#0f172a" stroke="url(#cyberGlow)" stroke-width="2.5"/>
  <!-- Cyan Visor -->
  <rect x="32" y="36" width="36" height="14" rx="4" fill="#00f0ff" opacity="0.95"/>
  <line x1="36" y1="43" x2="64" y2="43" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Neck & Torso -->
  <rect x="42" y="66" width="16" height="10" fill="#334155"/>
  <path d="M20 92 C20 78, 32 76, 50 76 C68 76, 80 78, 80 92 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Antenna -->
  <circle cx="50" cy="18" r="4" fill="#00f0ff"/>
  <line x1="50" y1="18" x2="50" y2="24" stroke="#00f0ff" stroke-width="2"/>
</svg>
